# Opt-in five-frame privileged state. The legacy robocasa_object_state.yaml
# remains unchanged at one frame and 48D for old train/play checkpoints.
# Per frame: BPS(10) + table corners(12) + object pose(3+6)
# + palm/object pose(9) + contact magnitudes(8) + object twist in pelvis(3+3)
# + object twist relative to palm(6) = 60D; five frames flatten to 300D.
defaults:
  - ../terms/object_bps@_here_
  - ../terms/table_corners_b@_here_
  - ../terms/object_pos_b@_here_
  - ../terms/object_ori_b_6d@_here_
  - ../terms/palm_object_transform_6d@_here_
  - ../terms/hand_object_contact_force_magnitude@_here_
  - ../terms/object_lin_vel_b@_here_
  - ../terms/object_ang_vel_b@_here_
  - ../terms/object_hand_rel_vel@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.StudentPrivilegedHistoryCfg
enable_corruption: false
concatenate_terms: true
history_length: 5
flatten_history_dim: false
