# @package _global_

defaults:
  - /callbacks/im_eval
  - manager_env/recorders: empty
  - _self_

checkpoint: ???

reference_free:
  enabled: false
  dataset_dir: ../../data/hf_dataset/data_update/data/pickup_table_walk_concat
  initial_pose_file: ../../outputs/pickup_table__alcohol_1__000_first_frame.pkl
  success_threshold: 0.1
  terminate_on_success: true
  debug_vis: true

# Override checkpoint termination parameters through their native config paths:
# ++manager_env.terminations.ee_body_pos.params.threshold=0.8
# ++manager_env.terminations.object_pos_deviation.params.threshold=25
# Without overrides, use the checkpoint config (including its eval_overrides).
log_reset_reasons: true
# A run-once play only consumes one motion per environment. Cap the paired
# motion/USD library before scene construction instead of indexing everything.
load_only_num_envs_motions: true

algo:
  config:
    eval:
      num_eval_episodes: 150
      save_videos: false
      video_save_prob: 1.0
      save_goal_reached_only: true
      save_trajectories: false
      num_save_episodes: 200

eval_timestamp: ${now:%Y%m%d_%H%M%S}
eval_name: TEST
eval_base_dir: logs_eval
eval_log_dir: ${eval_base_dir}/${eval_timestamp}-${eval_name}
hydra:
  run:
    dir: ${eval_log_dir}
