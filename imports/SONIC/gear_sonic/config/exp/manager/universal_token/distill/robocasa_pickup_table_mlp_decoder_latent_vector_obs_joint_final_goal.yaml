# @package _global_
#
# Compatibility variant of the joint student with final-frame object goals.
# The parent keeps the original joint experiment settings; this file makes
# the additional goal observation explicit for callers that need this ABI.

defaults:
  - /exp/manager/universal_token/distill/robocasa_pickup_table_mlp_decoder_latent_vector_obs_joint
  - _self_

exp_var: robocasa_pickup_table_mlp_decoder_latent_vector_obs_joint_final_goal
experiment_name: ${exp_base}_${exp_var}

manager_env:
  observations:
    privileged_obs:
      target_object_poses_6d:
        _target_: isaaclab.managers.ObservationTermCfg
        func: gear_sonic.envs.manager_env.mdp:target_object_poses_6d
        params:
          command_name: motion
          asset_cfg:
            _target_: isaaclab.managers.SceneEntityCfg
            name: object_to_hand_frame_transformer

algo:
  config:
    actor:
      backbone:
        module_config_dict:
          privileged_input_dim: 66
