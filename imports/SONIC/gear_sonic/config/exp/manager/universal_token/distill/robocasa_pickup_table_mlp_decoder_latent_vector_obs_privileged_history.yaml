# @package _global_
#
# Opt-in 5x60 privileged-history variant. The parent experiment and its 48D
# observation ABI remain unchanged for legacy training, evaluation, and play.

defaults:
  - /exp/manager/universal_token/distill/robocasa_pickup_table_mlp_decoder_latent_vector_obs
  - override /manager_env/observations/privileged_obs: robocasa_object_state_history
  - _self_

exp_var: robocasa_pickup_table_mlp_decoder_latent_vector_obs_privileged_history
experiment_name: ${exp_base}_${exp_var}

manager_env:
  config:
    # The dedicated palm observation requires exactly one rigid target frame.
    object_to_hand_frame_links: [right_hand_palm_link]

algo:
  config:
    rollout_storage_obs_shapes:
      proprio_obs: [5, 161]
      privileged_obs: [5, 60]
    actor:
      backbone:
        module_config_dict:
          privileged_input_dim: 300
