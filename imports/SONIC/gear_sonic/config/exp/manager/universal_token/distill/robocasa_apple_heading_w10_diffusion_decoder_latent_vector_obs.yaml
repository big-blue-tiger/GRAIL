# @package _global_
#
# Non-visual structured-state diffusion student for the apple tabletop task.
# The DAgger/flow-matching/decoder-distillation path is inherited unchanged;
# only the student condition source and camera-related environment nodes differ.

defaults:
  - /exp/manager/universal_token/distill/robocasa_apple_heading_w10_diffusion_decoder_latent
  - /manager_env/observations/proprio_obs: robocasa_history
  - /manager_env/observations/privileged_obs: robocasa_object_state
  - _self_

exp_var: robocasa_apple_heading_w10_diffusion_decoder_latent_vector_obs
experiment_name: ${exp_base}_${exp_var}

algo:
  config:
    actor:
      backbone:
        _target_: gear_sonic.trl.modules.diffusion_policy_modules.EncoderVectorDiffusionPolicy
        process_output_dim: true
        module_config_dict:
          proprio_key: proprio_obs
          proprio_input_dim: 805
          proprio_feature_dim: 512
          proprio_hidden_dims: [1024]
          privileged_key: privileged_obs
          privileged_input_dim: 48
          privileged_feature_dim: 512
          privileged_hidden_dims: [512]
          observation_normalization: standardize
          observation_norm_momentum: 0.05
          observation_norm_clip: 5.0
          observation_std_eps: 1.0e-4
          output_dim: [robot_action_dim]
          cond_dim: 1024
          timestep_dim: 128
          timestep_hidden_dim: 1024
          timestep_feature_dim: 256
          denoiser_hidden_dims: [2048, 2048, 1024]
          activation: SiLU
          diffusion_objective: flow_matching
          target_normalization: standardize
          target_norm_momentum: 0.05
          target_norm_clip: 5.0
          target_std_eps: 1.0e-4
          num_train_timesteps: 100
          num_inference_steps: 4
          num_timestep_buckets: 1000
          noise_beta_alpha: 1.5
          noise_beta_beta: 1.0
          noise_s: 0.999
          beta_start: 1.0e-4
          beta_end: 2.0e-2
          diffusion_loss_coef: 1.0

manager_env:
  observations:
    # The inherited experiment enables this group for RGB.  Nulling it keeps
    # the observation manager and trainer from requesting an ego camera.
    camera_rgb: null
  config:
    enable_cameras: false
    render_ego: false
    render_results: false
    overview_camera: false
    cameras: null
    camera_resolution: null
