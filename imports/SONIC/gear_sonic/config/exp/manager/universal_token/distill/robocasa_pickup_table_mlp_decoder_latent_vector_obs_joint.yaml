# @package _global_
#
# Direct-concatenation MLP student over raw structured observations.
# Inherits the split-encoder experiment and adds final-frame reference object
# poses relative to the live pelvis and hand to the student observations.

defaults:
  - /exp/manager/universal_token/distill/robocasa_pickup_table_mlp_decoder_latent_vector_obs
  - _self_

exp_var: robocasa_pickup_table_mlp_decoder_latent_vector_obs_joint_ema
experiment_name: ${exp_base}_${exp_var}

algo:
  config:
    actor:
      backbone:
        _target_: gear_sonic.trl.modules.diffusion_policy_modules.EncoderJointVectorMlpPolicy
        module_config_dict:
          latent_normalization: empirical
          latent_norm_eps: 1.0e-3
          latent_norm_until: null
          mlp_hidden_dims: [2048, 2048, 512]

    use_clampped_std: true
    std_clamp_min: 0.001
    std_clamp_max: 0.5
    max_grad_norm: 1
    num_mini_batches: 16
    actor_learning_rate: 2.0e-4
