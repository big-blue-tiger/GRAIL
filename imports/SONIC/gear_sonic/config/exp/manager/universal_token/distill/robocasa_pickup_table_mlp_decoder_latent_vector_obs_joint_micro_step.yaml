# @package _global_

defaults:
  - /exp/manager/universal_token/distill/robocasa_pickup_table_mlp_decoder_latent_vector_obs_joint
  - _self_

exp_var: robocasa_pickup_table_mlp_decoder_latent_vector_obs_joint_micro_step
experiment_name: ${exp_base}_${exp_var}

algo:
  config:
    teacher_termination_loss_override:
      enabled: true
    # Each student termination and its BC-mask check use an independent schedule.
    termination_threshold_schedule:
      enabled: true
      terms:
        ee_body_pos:
          start: 0.3
          end: 0.8
          end_iteration: 6000
        object_pos_deviation:
          start: 0.3
          end: 0.8
          end_iteration: 6000

manager_env:
  recorders:
    # Metrics only: do not create or export trajectory datasets.
    dataset_export_mode: 0
    export_in_record_pre_reset: false
    object_position_success:
      _target_: gear_sonic.envs.manager_env.mdp.recorders.ObjectPositionSuccessRecorderCfg
      command_name: motion
      threshold: 0.1
  config:
    action_transform_active_encoders: [g1]
  terminations:
    ee_body_pos:
      params:
        threshold: ${algo.config.termination_threshold_schedule.terms.ee_body_pos.start}
    object_pos_deviation:
      params:
        threshold: ${algo.config.termination_threshold_schedule.terms.object_pos_deviation.start}
  rewards:
    micro_step_penalty:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp.micro_step_reward:MicroStepPenalty
      # Each qualifying foot touchdown contributes weight * step_dt to the reward.
      weight: -8.0
      params:
        # command_name: motion_velocity
        min_step_length: 0.13
        min_air_time: 0.3
        # Reference-speed gating is commented out in MicroStepPenalty.
        # use_slow_speed_gate: true
        # slow_speed_full: 0.05
        # slow_speed_zero: 0.10
        sensor_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: contact_forces
          body_names: [left_ankle_roll_link, right_ankle_roll_link]
          preserve_order: true
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
          body_names: [left_ankle_roll_link, right_ankle_roll_link]
          preserve_order: true
