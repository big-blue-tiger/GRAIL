# @package _global_
#
# Direct behavior-cloning student for the complete pickup_table motion set.
# The condition encoders are shared with the vector diffusion experiment, but
# the student predicts the decoder action directly with an independent MLP
# action head.

defaults:
  - /exp/manager/universal_token/distill/robocasa_pickup_table_diffusion_decoder_latent_vector_obs
  - _self_

exp_var: robocasa_pickup_table_mlp_decoder_latent_vector_obs
experiment_name: ${exp_base}_${exp_var}
manager_env:
  config:
    gpu_collision_stack_size_exp: 30
  rewards:
    # Remove all reference-motion tracking signals. Null (instead of weight 0)
    # keeps these terms out of RewardManager's active term set entirely.
    tracking_anchor_pos: null
    tracking_anchor_ori: null
    tracking_relative_body_pos: null
    tracking_relative_body_ori: null
    tracking_body_linvel: null
    tracking_body_angvel: null
    object_tracking_reward: null

    # Make contact achievable first, then reward a sustained multi-finger grasp.
    # Ungating this term removes its dependency on reference-motion contact time.
    grasp_reward:
      weight: 10.0
      params:
        gate_with_contact_label: false
        hand: right_hand
        command_name: motion
        min_contacts: 4
    grasp_finger_direction:
      # Keep this as a weak geometric hint while physical contact stays primary.
      weight: 2.0
      params:
        use_contact_center: true

    # Exclude the two discrete finger primitive dimensions from smoothing.
    meta_action_rate_l2:
      weight: -1.0
      params:
        token_only: true

    # Direct-latent, non-delta execution does not update this term's history.
    full_latent_rate_l2: null

    # Smooth the decoded joint command directly.
    action_rate_l2:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:action_rate_l2
      weight: -0.02
    anti_shake_ang_vel:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:anti_shake_ang_vel_l2
      weight: -0.01
      params:
        command_name: motion
        threshold: 1.5
        body_names:
          - left_wrist_yaw_link
          - right_wrist_yaw_link
          - head_link

    # Stop penalizing wrist motion after a stable physical grasp is established.
    approach_velocity_penalty:
      weight: -15.0
      params:
        min_contacts: 4
        disable_after_contact: true
algo:
  config:
    # Parameterize policy noise as log(std), ensuring std = exp(log_std) > 0.
    use_log_std: true
    # Complementary PPO + behavior-cloning objective:
    #   lambda_bc(k)  = max(0.2, 1 - k / 10000)
    #   lambda_ppo(k) = 1 - lambda_bc(k)
    # The static coefficients below are replaced while this schedule is enabled.
    ppo_loss_coef: 0.0
    distill_teacher_loss_coef: 0.0
    compute_aux_loss: true
    aux_loss_scale: 1.0
    num_learning_epochs: 3
    gamma: 0.99
    lam: 0.95
    num_steps_per_env: 24
    actor_learning_rate: 2.0e-4
    entropy_coef: 0.001
    desired_kl: 0.01
    init_noise_std: 0.01
    # PPO must execute actions sampled from the Student's Gaussian policy.
    # The inherited diffusion-distillation config replaces sampled actions with
    # the mean, which makes the rollout distribution inconsistent with the
    # Gaussian log-probabilities used by PPO. Teacher rollouts remain
    # deterministic via an explicit override in the trainer.
    distill_rollout_with_action_mean: false
    ppo_bc_loss_schedule:
      enabled: true
      bc_min_coef: 0.2
      # lambda_bc(k) = max(0.2, 1 - k / 10000)
      end_iteration: 5000
      # Keep LR fixed before this iteration, then enable desired-KL adaptation.
      adaptive_after_iteration: 1000
    # Match the transformer-flow linear DAgger curriculum: start with all
    # Teacher environments, linearly grow the Student share to 0.5 at
    # iteration 3000, then keep a 1:1 Student/Teacher rollout split.
    dagger_rollout_mode: fixed
    dagger_student_ratio: 1
    dagger_student_ratio_increment: 0.0
    decoder_distill: true
    # Supervise the direct-latent MLP in the same continuous space in which it
    # executes. The Teacher target is encoder latent + scaled residual
    # immediately before FSQ.
    target_latent_mode: pre_quantization
    # These keys only control the terminal table. All metrics are still sent
    # to the configured experiment tracker regardless of this allowlist.
    console_loss_keys:
      - loss/weighted_ppo_loss_avg
      - loss/policy_avg
      - loss/value_avg
      - loss/entropy_avg
      - loss/aux_latent_bc_mse_avg
      - loss/total_aux_loss_avg
      - loss/lambda_ppo
      - loss/lambda_bc
    # The environment deliberately preserves the five-frame proprio history as
    # [B, 5, 161]. The regular PPO rollout storage otherwise allocates this
    # group from its flattened metadata (805), which cannot store that tensor.
    rollout_storage_obs_shapes:
      proprio_obs: [5, 161]
    actor:
      backbone:
        _target_: gear_sonic.trl.modules.diffusion_policy_modules.EncoderVectorMlpPolicy
        process_output_dim: true
        module_config_dict:
          # Marker only; EncoderVectorMlpPolicy does not use diffusion sampling.
          diffusion_objective: bc_mse
          mlp_hidden_dims: [2048, 1024, 512]
          # Paper's DAgger imitation-loss coefficient.
          bc_loss_coef: 10.0
