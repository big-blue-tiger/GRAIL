paths:
  input: null
  teacher_checkpoint: null
  generator_checkpoint: null
  output_dir: outputs/dagger_online
  dataset_root: null

training:
  # Optional fixed learning rate for online DAgger. When set, this overrides
  # the optimizer state restored from the generator checkpoint and disables
  # scheduler updates. Leave null to resume the checkpoint's LR schedule.
  learning_rate: null
  iterations: 300
  epochs_per_rollout: 1
  # Online training shares the GPU with Isaac Sim, teacher, ATM, and EMA.
  # Keep this much smaller than the offline per-GPU batch size.
  batch_size: 32
  progress_every: 10
  teacher_ratio: 0.5
  # Match the fast offline generator training configuration.
  mixed_precision: fp16

rollout:
  horizon: 40
  execution_horizon: 20
  control_fps: 50
  progress_every: 10
  # Print the Python stack repeatedly if one rollout phase stops returning.
  # Set to 0 to disable after the rollout has been verified on a machine.
  stall_trace_seconds: 60
  # Constructor watchdog for CUDA/Kit initialization before the first rollout.
  startup_trace_seconds: 90
  phase_trace: false

diagnostics:
  # Keep disabled for normal training; enable explicitly for the CUDA/Kit
  # lifetime investigation described in .ai-bridge/current-plan.md.
  enabled: false
  phase_logging: true
  synchronize: false
  nvml: false
  nvtx: false
  tensor_census: false
  # Experimental: synchronize before clearing teacher/ATM rollout state.
  safe_teacher_cleanup: false
  # Isolation modes for the plan's collect matrix. Any non-default mode also
  # requires diagnostics.enabled=true so it cannot be enabled accidentally.
  collection_mode: full
  collect_only: false
  forward_only: false
  disable_optimizer: false
  skip_checkpoint: false
  memory_history: false
  memory_snapshot: false
  max_history_entries: 100000
  snapshot_dir: diagnostics/memory

environment:
  # Load at most this many motions/environments on the GPU at once. When the
  # input contains more motions, DAgger cycles through batches per iteration.
  max_parallel_envs: 64
  # Isaac Sim's default timeline may stop at about 10 seconds.  A STOP event
  # enters SimulationContext's render-wait callback and prevents Python from
  # reaching the first optimizer step after a long rollout.
  timeline_end_time: 1000000.0
  start_frame: 50
  randomize_initial_pose: false
  init_z_offset: 0.05
  root_x_range: [-0.1, 0.1]
  root_y_range: [-0.1, 0.1]
  collision_stack_size_exp: 28

checkpoint:
  every: 1

logging:
  project: dagger_train

seed: 55
