defaults:
  - _self_
  - task: null
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

name: train_generator
_target_: sugar_il.workspace.train_generator_workspace.TrainGeneratorWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

n_action_steps: 40
n_obs_steps: 1
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_cond: True
use_last_action: True
use_target: True
num_epochs: 1000
dataset_path: null
start_ckpt_path: null
log_path: data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}

policy:
  _target_: sugar_il.policy.generator.Generator

  shape_meta: ${shape_meta}

  obs_encoder:
    _target_: sugar_il.model.encoder.generator_state_encoder.GeneratorStateObsEncoder
    shape_meta: ${shape_meta}
    feature_dim: 512
    token_hidden_dim: 512
    proprioception_dropout: 0.1

  num_inference_steps: 4
  num_timestep_buckets: 1000
  noise_beta_alpha: 1.5
  noise_beta_beta: 1.0
  noise_s: 0.999
  # Size presets (all use feature_dim=512): 12 ~= 60M, 16 ~= 77M, 20 ~= 94M.
  n_layer: 16
  n_head: 8
  frequency_embedding_size: 256
  ffn_ratio: 4
  ffn_activation: gelu
  time_conditioning: token
  use_action_time_encoder: False
  velocity_head_layers: 1
  zero_init_velocity_head: False
  hand_num_layers: 2
  p_drop_attn: 0.1
  hand_loss_weight: 1.0

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: True

optimizer:
  # Kept as an interpolation so the learning rate can be overridden with
  # ``lr=...`` directly from the Hydra command line.
  lr: ${lr}
  weight_decay: 1e-4
  betas: [0.95, 0.999]

# Peak learning rate before the cosine schedule starts decaying. This is not a
# minimum: with the cosine scheduler the final learning rate approaches zero.
lr: 2e-4

training:
  device: "cuda:0"
  # Accelerate accepts "no", "fp16", or "bf16". FP16 supports the target
  # Quadro RTX 6000 (Turing); Ampere-or-newer systems may override with bf16.
  mixed_precision: "fp16"
  seed: 42
  # start_ckpt_path requires resume=True and a complete training checkpoint.
  resume: False
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 7000
  # Optional schedule horizon, measured using the first run's batches per epoch.
  scheduler_num_epochs: null
  num_epochs: ${num_epochs}
  gradient_accumulate_every: 2
  # The generator uses LayerNorm/RMSNorm only, so EMA is safe here.
  use_ema: False
  # training loop control
  # in epochs
  rollout_every: 10
  checkpoint_every: 1
  val_every: 10000
  # Number of evenly spaced validation runs in each validation epoch.
  # For example, val_every=1 and val_checks_per_epoch=4 validates at
  # 25%, 50%, 75%, and 100% of every epoch.
  val_checks_per_epoch: 4
  save_loss_curve: True
  loss_curve_every: 1
  sample_every: 10
  gen_attn_map: True
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

ema:
  _target_: sugar_il.model.flowmatching.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.6666666666666666
  min_value: 0.0
  max_value: 0.9999

logging:
  project: train_generator
  # resume: False
  # mode: online
  name: ${now:%Y.%m.%d-%H.%M}_${name}_${task_name}
  # tags: ["${name}", "${task_name}", "${exp_name}"]
  # id: null
  # group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: False
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${log_path}
