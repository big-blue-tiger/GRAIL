name: ObjectAwareSONIC

dataset_paths:
  - ${dataset_path}

shape_meta: &shape_meta
  obs:
    n_obs_steps: 1
  action:
    latent_dim: 64
    hand_dim: 2
    horizon: 40

env_runner:
  _target_: sugar_il.env_runner.generator_runner.GeneratorRunner

dataset:
  _target_: sugar_il.dataset.generator_dataset.GeneratorDataset
  pickle_paths: ${task.dataset_paths}
  horizon: 40
  seed: ${training.seed}
  val_ratio: 0.05
